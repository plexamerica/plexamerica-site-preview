<style>
  html, body { background: #0d1a40; }
  body { margin: 0; }
  /* simula um viewport desktop a 1440px de largura, com letterboxing
     se a janela for maior. O artboard é o próprio body. */
  .frame {
    width: 1440px;
    margin: 0 auto;
    background: #0d1a40;
    box-shadow: 0 20px 80px rgba(0,0,0,0.4);
  }
  @media (max-width: 1440px) {
    .frame { width: 100%; }
  }
  /* Em < 900px a nav vira um menu icônico para não competir com a marca. */
  @media (max-width: 900px) {
    nav.plex-topnav { display: none !important; }
    .plex-mobile-menu { display: inline-flex !important; }
  }
  .plex-mobile-menu {
    display: none;
    width: 36px; height: 36px;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 4px;
    align-items: center; justify-content: center;
    color: #FFFFFF; cursor: pointer;
    background: transparent;
  }
  .plex-mobile-menu span {
    width: 16px; height: 1.5px; background: currentColor;
    box-shadow: 0 5px 0 currentColor, 0 -5px 0 currentColor;
  }
</style>
