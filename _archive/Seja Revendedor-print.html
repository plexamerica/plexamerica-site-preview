<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Seja Revendedor — PlexAmerica</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; }
  body { font-family: var(--plex-font); color: #15172A; }
  *, *::before, *::after { box-sizing: border-box; }
  a { color: inherit; }

  @media print {
    @page { size: A4 portrait; margin: 0.5cm; }
    html, body {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      background: #FFFFFF !important;
    }
    /* Each major section starts fresh in landscape-ish flow but keeps internal cohesion */
    main > section {
      break-inside: avoid-page;
      page-break-inside: avoid;
    }
    /* Force backgrounds and gradients to print */
    section, footer, header, div, h1, h2, h3, p {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    /* Avoid cropping interior content */
    section { overflow: visible !important; }
    /* Avoid splitting cards / form / bullets */
    form, .card, label, h2, h3 {
      break-inside: avoid;
      page-break-inside: avoid;
    }
    /* Drop hover-only chrome and animations */
    * {
      transition: none !important;
      animation: none !important;
    }
    /* Hide nothing — keep topbar, hero, form, CTA, footer */
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root" data-screen-label="Seja Revendedor"></div>

<script type="text/babel" src="map-amazonia.jsx"></script>
<script type="text/babel" src="home-shared.jsx"></script>
<script type="text/babel" src="revendedor-sections.jsx"></script>
<script type="text/babel">
  const { Topbar } = window.HomeShared;
  const { HeroRevendedor, PropostaForm, CtaWhatsapp } = window.RevendedorPage;
  const REV_TOPBAR_THEME = { bg: "#0d1a40", text: "#FFFFFF" };

  function RevendedorApp() {
    return (
      <main>
        <Topbar theme={REV_TOPBAR_THEME} active="revendedor" />
        <HeroRevendedor />
        <PropostaForm />
        <CtaWhatsapp />
        <footer style={{ background: "#0d1a40", color: "rgba(255,255,255,0.78)",
          borderTop: "1px solid rgba(255,255,255,0.06)" }}>
          <div style={{ maxWidth: 1280, margin: "0 auto",
            padding: "clamp(48px, 6vw, 72px) clamp(16px, 3vw, 32px)",
            display: "flex", flexWrap: "wrap", justifyContent: "space-between",
            alignItems: "center", gap: 24 }}>
            <img src="assets/brand/marca-hor-white.png?v=3" alt="PlexAmerica"
                 style={{ height: 36, width: "auto", display: "block" }} />
            <div style={{ fontSize: 13, lineHeight: 1.6,
              color: "rgba(255,255,255,0.55)", textAlign: "right" }}>
              <div>PlexAmerica Indústria e Comércio Ltda</div>
              <div>Guajará-Mirim/RO · Brasil</div>
            </div>
          </div>
        </footer>
      </main>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<RevendedorApp />);

  // Auto-print: wait for fonts + a render tick + safety delay
  (async () => {
    try { await document.fonts.ready; } catch (_) {}
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    await new Promise(r => setTimeout(r, 600));
    window.print();
  })();
</script>
</body>
</html>
