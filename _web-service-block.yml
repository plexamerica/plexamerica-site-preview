
  # ========================================
  # WEB - Site institucional plexamerica.com.br
  # ========================================
  web:
    image: nginx:alpine
    container_name: web
    restart: unless-stopped
    volumes:
      - ./web/html:/usr/share/nginx/html:ro
    networks:
      - plexnet
    environment:
      - TZ=${TZ}
    labels:
      - "traefik.enable=true"
      # Router HTTPS - raiz + www
      - "traefik.http.routers.web.rule=Host(`plexamerica.com.br`) || Host(`www.plexamerica.com.br`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web.service=web"
      - "traefik.http.routers.web.middlewares=redirect-www"
      # Service
      - "traefik.http.services.web.loadbalancer.server.port=80"
      # Middleware: www -> raiz (301)
      - "traefik.http.middlewares.redirect-www.redirectregex.regex=^https?://www\\.plexamerica\\.com\\.br/(.*)"
      - "traefik.http.middlewares.redirect-www.redirectregex.replacement=https://plexamerica.com.br/$${1}"
      - "traefik.http.middlewares.redirect-www.redirectregex.permanent=true"
    deploy:
      resources:
        limits:
          memory: 64M

