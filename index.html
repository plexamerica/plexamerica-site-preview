<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PlexAmerica · Home</title>
<link rel="stylesheet" href="styles.css" />

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <rect width="200" height="200" fill="#0d1a40"/>
    <circle cx="100" cy="100" r="60" fill="none" stroke="#F6B817" stroke-width="3" stroke-dasharray="4 6"/>
    <circle cx="100" cy="100" r="6" fill="#F6B817"/>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body class="theme-deep">
<div id="root"></div>

<script type="text/babel" src="map-amazonia.jsx"></script>
<script type="text/babel" src="home-shared.jsx"></script>
<script type="text/babel" src="home-sections.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
  const { Topbar, Hero, Manifesto } = window.HomeShared;
  const { Marcas, Cobertura, PorQue, Categorias, DualCta, Footer } = window.HomeSections;
  const { A } = window.HOME_THEMES;

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "density": "padrao",
    "mapLanguage": "geodesic",
    "heroVoice": "editorial"
  }/*EDITMODE-END*/;

  const DENSITY_MULT = { aerada: 1.35, padrao: 1, compacta: 0.7 };

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    return (
      <React.Fragment>
        <div className="home-root" style={{
          width: "100%", background: "#0d1a40", color: "#FFF",
          ["--plex-density-mult"]: String(DENSITY_MULT[t.density] || 1),
        }}>
          <Topbar theme={A.hero} />
          <Hero theme={A} mapLanguage={t.mapLanguage} heroVoice={t.heroVoice} />
          <Manifesto theme={A} variant="A" />
          <Marcas theme={A} variant="A" />
          <Cobertura theme={A} mapLanguage={t.mapLanguage} />
          <PorQue theme={A} />
          <Categorias theme={A} />
          <DualCta theme={A} />
          <Footer theme={A} variant="A" />
        </div>
        <TweaksPanel title="Tweaks · Home">
          <TweakSection label="Densidade do bloco" />
          <TweakRadio
            label="Ritmo vertical"
            value={t.density}
            options={[
              { value: "aerada",   label: "Aerada" },
              { value: "padrao",   label: "Padrão" },
              { value: "compacta", label: "Compacta" },
            ]}
            onChange={(v) => setTweak("density", v)}
          />
          <TweakSection label="Linguagem do mapa" />
          <TweakRadio
            label="Expressão"
            value={t.mapLanguage}
            options={[
              { value: "geodesic",      label: "Rotas" },
              { value: "constellation", label: "Pontos" },
              { value: "silhouette",    label: "Silhueta" },
            ]}
            onChange={(v) => setTweak("mapLanguage", v)}
          />
          <TweakSection label="Voz do hero" />
          <TweakRadio
            label="Tom da abertura"
            value={t.heroVoice}
            options={[
              { value: "editorial", label: "Editorial" },
              { value: "manifesto", label: "Manifesto" },
              { value: "direto",    label: "Direto" },
            ]}
            onChange={(v) => setTweak("heroVoice", v)}
          />
        </TweaksPanel>
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
