<style>
:root{--navy:#253875;--gold:#F6B817;--deep:#0d1a40;--white:#fff;--gray:#F2F2F2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--deep);color:var(--white);-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
.card{width:100%;max-width:480px;min-height:100%;display:flex;flex-direction:column;background:var(--navy)}
.top{display:flex;justify-content:flex-end;align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 0}
.logo{display:block;height:26px;width:auto;max-width:100%;margin:4px auto 28px}
@media (min-width:768px){.logo{height:32px}}
.lang{display:flex;gap:4px;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.lang button{font:600 12px/1 Poppins,system-ui,sans-serif;color:var(--white);background:none;border:0;border-radius:999px;padding:7px 10px;cursor:pointer;letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--navy)}
.hero{text-align:center;padding:20px 24px 28px}
h1{font-size:28px;font-weight:700;line-height:1.2}
.role{margin-top:6px;color:var(--gold);font-weight:600;font-size:17px}
.hero-photo{width:180px;height:180px;border-radius:50%;object-fit:cover;object-position:50% 15%;border:3px solid #F6B817;box-shadow:0 4px 12px rgba(0,0,0,.2);display:block;margin:0 auto 16px;background:var(--gold)}
@media (max-width:480px){.hero-photo{width:140px;height:140px;border:2px solid #F6B817}}
.partners{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:280px;margin:0 auto}
.partners a{-webkit-tap-highlight-color:rgba(246,184,23,.35);cursor:pointer;transition:transform .2s ease,opacity .2s ease,box-shadow .2s ease;background:var(--white);border-radius:12px;height:84px;display:flex;align-items:center;justify-content:center;padding:10px}
.partners img{max-height:64px;max-width:100%;width:auto;height:auto}
.partners a:hover{transform:scale(1.03);opacity:.9}
.partners a:active{transform:scale(.97);box-shadow:0 0 0 3px var(--gold)}
.partners a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.excl{margin:12px 0 18px;font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.9);line-height:1.5}
@media (min-width:768px){.partners{gap:16px;max-width:320px}}
.actions{display:flex;flex-direction:column;gap:12px;padding:8px 20px 28px}
.btn{display:flex;align-items:center;gap:14px;min-height:56px;padding:0 20px;border-radius:14px;font:600 16px/1.2 Poppins,system-ui,sans-serif;text-decoration:none;color:var(--white);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.btn svg{width:22px;height:22px;flex:none}
footer{margin-top:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;background:var(--deep)}
.slogan-mark{max-width:240px;width:100%;height:auto;display:block;margin:24px auto 0;opacity:1}
@media (max-width:480px){.slogan-mark{max-width:180px}}
footer .legal{margin-top:14px;color:rgba(255,255,255,.7)}
</style>

</main>
<script>
(function(){
  var T={
    pt:{html:"pt-BR",siteUrl:"https://plexamerica.com.br/",role:"Diretor Comercial",excl:"Importador / Distribuidor Exclusivo · RO/AC/AM",save:"Salvar Contato",wa:"Conversar no WhatsApp",mail:"Enviar Email",site:"Visitar Site",tRey:"Visite Reyplast · Fabricante peruano",tLuz:"Visite Horneados Únicos · Luz Marina Bolivia"},
    en:{html:"en",siteUrl:"https://plexamerica.com.br/en/",role:"Commercial Director",excl:"Exclusive Importer / Distributor · RO/AC/AM, Brazil",save:"Save Contact",wa:"Chat on WhatsApp",mail:"Send Email",site:"Visit Website",tRey:"Visit Reyplast · Peruvian manufacturer",tLuz:"Visit Horneados Únicos · Luz Marina Bolivia"},
    es:{html:"es",siteUrl:"https://plexamerica.com.br/en/",role:"Director Comercial",excl:"Importador / Distribuidor Exclusivo · RO/AC/AM, Brasil",save:"Guardar Contacto",wa:"Hablar por WhatsApp",mail:"Enviar Correo",site:"Visitar Sitio",tRey:"Visite Reyplast · Fabricante peruano",tLuz:"Visite Horneados Únicos · Luz Marina Bolivia"}
  };
  var KEY="jcabral-lang";
  function set(l){
    if(!T[l])l="pt";
    var t=T[l];
    document.documentElement.lang=t.html;
    document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=t[el.getAttribute("data-i18n")]});
    document.querySelectorAll("[data-i18n-title]").forEach(function(el){el.title=t[el.getAttribute("data-i18n-title")]});
    document.querySelectorAll("[data-i18n-href]").forEach(function(el){el.href=t[el.getAttribute("data-i18n-href")]});
    document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-lang")===l)});
    try{localStorage.setItem(KEY,l)}catch(e){}
  }
  var saved=null;
  try{saved=localStorage.getItem(KEY)}catch(e){}
  var nav=(navigator.language||"pt").slice(0,2).toLowerCase();
  set(saved||(T[nav]?nav:(nav==="pt"?"pt":"en")));
  document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){set(b.getAttribute("data-lang"))})});
})();
</script>
